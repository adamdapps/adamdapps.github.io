<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plana</title>
<link rel="icon" href="web/icons/Icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #6C63FF;
    --purple-dark: #4B44CC;
    --text: #1C1B21;
    --muted: #6B6B76;
    --bg: #FAFAFD;
    --card: #FFFFFF;
    --border: #ECEBF5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #F1F0FA;
      --muted: #A9A7BE;
      --bg: #121016;
      --card: #1B1922;
      --border: #2A2733;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  img.icon {
    width: 92px;
    height: 92px;
    border-radius: 22px;
    box-shadow: 0 8px 24px rgba(108,99,255,0.28);
    margin-bottom: 20px;
  }
  h1 {
    font-size: 32px;
    font-weight: 800;
    color: var(--purple);
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }
  p.tagline {
    color: var(--muted);
    font-size: 16px;
    margin: 0 0 32px;
    line-height: 1.5;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .links a {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: border-color 0.15s ease;
  }
  .links a:hover {
    border-color: var(--purple);
  }
  .links a span.arrow {
    color: var(--purple);
    float: right;
  }
  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: 13px;
  }
  footer a { color: var(--purple); text-decoration: none; }
</style>
</head>
<body>

<div class="wrap">
  <img class="icon" src="web/icons/Icon-192.png" alt="Plana app icon">
  <h1>Plana</h1>
  <p class="tagline">Plan weddings and events without the spreadsheet chaos — budget, guest list, seating, timeline and to-dos, all in one place.</p>

  <div class="links">
    <a href="privacy-policy.html">Privacy Policy <span class="arrow">&rarr;</span></a>
    <a href="support-policy.html">Support <span class="arrow">&rarr;</span></a>
  </div>

  <footer>
    &copy; 2026 Adam White &middot; <a href="mailto:support@adamdeanapps.co.uk">support@adamdeanapps.co.uk</a>
  </footer>
</div>

</body>
</html>
